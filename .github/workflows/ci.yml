name: Build & Test

# Compiles the app for the iOS Simulator and runs the XCTest suite on every push.
# Needs no Apple account or secrets — this is the "does it compile?" gate.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Simulator build + unit tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(python3 tools/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build for simulator
        shell: bash
        run: |
          set +e
          mkdir -p build
          xcodebuild build-for-testing \
            -project CastleEscape.xcodeproj \
            -scheme CastleEscape \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/xcodebuild-build.log | grep -E "error:|\*\* BUILD"
          status="${PIPESTATUS[0]}"
          grep -hE "error:" build/xcodebuild-build.log | sort -u | head -30 | while read -r line; do echo "::error::$line"; done
          echo "::notice title=Simulator build::exit status $status — $(xcodebuild -version | tr '\n' ' ')"
          exit "$status"

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          xcodebuild test-without-building \
            -project CastleEscape.xcodeproj \
            -scheme CastleEscape \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/xcodebuild-test.log | grep -E "Test Case|Executed|error:|\*\* TEST"
          status="${PIPESTATUS[0]}"
          summary=$(grep -E "Executed [0-9]+ tests" build/xcodebuild-test.log | tail -1)
          xcode=$(xcodebuild -version | tr '\n' ' ')
          echo "::notice title=Unit tests::${summary:-no summary} — $xcode"
          grep -hE "error:" build/xcodebuild-build.log build/xcodebuild-test.log | sort -u | head -20 > build/errors.txt
          while read -r line; do echo "::error::$line"; done < build/errors.txt
          warnings=$(grep -c "warning:" build/xcodebuild-build.log)
          echo "::notice title=Compiler warnings::${warnings:-0} warning lines in the simulator build"
          exit "$status"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build/*.log
            build/TestResults.xcresult
          if-no-files-found: ignore
